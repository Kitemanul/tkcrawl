[project]
name = "tkcrawl"
version = "0.1.0"
description = "抖音数据采集 CLI 工具"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "playwright>=1.40",
    "httpx>=0.25",
    "pydantic>=2.5",
    "rich>=13.0",
]

[project.scripts]
tkcrawl = "tkcrawl.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tkcrawl"]
